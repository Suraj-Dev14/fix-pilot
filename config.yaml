project:
  name: fixpilot-demo

service:
  name: product-service

environment: production

integrations:
  logs: 
    provider: cloudwatch
    log_group: "Fix-Pilot"

  source_control:
    provider: github
    repository: Suraj-Dev14/fix-pilot

  deployments:
    provider: github

  api: demo

  regression:
    provider: local
    command: python -m pytest

incident:
  default_severity: medium
